name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:portable
      - run: npm test -- --run
      - run: npm run build

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_tools=$(mktemp -d)
          trap 'rm -rf "$scan_tools"' EXIT
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_linux_x64.tar.gz" --output "$scan_tools/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_checksums.txt" --output "$scan_tools/checksums.txt"
          (cd "$scan_tools" && sha256sum --check --ignore-missing checksums.txt && tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          "$scan_tools/gitleaks" git . --config .gitleaks.toml --log-opts="--all --full-history" --redact=100 --no-banner
